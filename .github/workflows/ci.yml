name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mind:
    name: MIND renderer (mindc v0.10.2)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install MLIR toolchain (LLVM 20)
        run: |
          sudo apt-get update
          sudo apt-get install -y mlir-20-tools clang-20
          echo "/usr/lib/llvm-20/bin" >> "$GITHUB_PATH"

      - name: Install mindc
        run: ./scripts/get_mindc.sh

      - name: Check toolchain
        run: ./scripts/check_toolchain.sh

      - name: Type-check, build and verify image hashes
        run: ./scripts/test.sh

  cuda:
    name: CUDA kernels compile (CUDA 13.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: nvidia/cuda:13.4.2-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v7

      - name: Compile kernels
        run: ./native-cuda/build.sh
